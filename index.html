            <li><strong>LCP (Largest Contentful Paint):</strong> kecepatan elemen terbesar dimuat. Target: &lt; 2.5 detik.</li>
            <li><strong>INP (Interaction to Next Paint):</strong> responsivitas interaksi. Target: &lt; 200 ms.</li>

    // ============================================================
    // UTIL
    // ============================================================
    const stripHTML = (html) => html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();

    const wordCount = (html) => stripHTML(html).split(/\s+/).length;

    const readingTime = (html) => Math.max(1, Math.ceil(wordCount(html) / 200));

    const formatDate = (iso) => new Date(iso).toLocaleDateString('id-ID', {
      day: 'numeric', month: 'long', year: 'numeric'
    });

    const escapeHtml = (str) => str.replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));

    // RENDER: KARTU ARTIKEL
    // ============================================================

            <span>⏱ ${readingTime(a.content)} menit baca</span>
            <span>&middot;</span>
            <span>✍ ${escapeHtml(a.author)}</span>

          <p class="text-slate-600 dark:text-slate-400 mb-4">${escapeHtml(a.description)}</p>

            class="inline-flex items-center text-brand-600 dark:text-brand-400 font-medium text-sm hover:underline">
            Baca Selengkapnya <span class="ml-1">&rarr;</span>

        </div>
      </article>
    `;

    // ============================================================
    // RENDER: HALAMAN ARTIKEL

    const articlePage = (a) => `

        <div class="p-6 sm:p-8">
          <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-slate-100 mb-3">${escapeHtml(a.title)}</h2>

            <time datetime="${a.date}">${formatDate(a.date)}</time>
            <span>&middot;</span>
            <span>⏱ ${readingTime(a.content)} menit baca</span>

    const staticPage = (title, content) => `

    // ============================================================
    // DATA HALAMAN

    const pages = {

      about: () => staticPage('About', `

        <p>Tujuan kami adalah menyediakan konten yang bermanfaat, mudah dipahami, dan dapat diakses oleh siapa saja secara gratis.</p>

        <p>Terima kasih telah mengunjungi website kami. Semoga bermanfaat!</p>
      `),

      contact: () => staticPage('Contact', `
        <p>Jika Anda memiliki pertanyaan, saran, atau ingin bekerja sama, silakan hubungi kami melalui:</p>
        <ul class="list-disc pl-6 space-y-1">
          <li>Email: <a href="mailto:admin@example.com" class="text-brand-600 dark:text-brand-400 hover:underline">admin@example.com</a></li>
          <li>WhatsApp: +62 812-3456-7890</li>

        </ul>
        <p>Kami akan berusaha merespons pesan Anda dalam waktu 1x24 jam pada hari kerja.</p>
      `),

      disclaimer: () => staticPage('Disclaimer', `
        <p>Semua informasi yang disediakan di Blog Sederhana bersifat umum dan hanya untuk tujuan informasi.</p>
        <p>Kami tidak menjamin keakuratan, kelengkapan, atau kegunaan informasi yang terdapat di website ini. Segala risiko yang timbul dari penggunaan informasi di website ini sepenuhnya menjadi tanggung jawab pengguna.</p>
        <p>Website ini mungkin berisi tautan ke situs eksternal. Kami tidak bertanggung jawab atas konten atau kebijakan privasi situs pihak ketiga tersebut.</p>
        <p>Dengan menggunakan website ini, Anda menyetujui ketentuan dalam disclaimer ini.</p>

      privacy: () => staticPage('Privacy Policy', `
        <p>Kami di Blog Sederhana menghargai privasi setiap pengunjung. Kebijakan privasi ini menjelaskan bagaimana kami mengumpulkan, menggunakan, dan melindungi informasi Anda.</p>

          <li><strong class="text-slate-800 dark:text-slate-200">Informasi yang dikumpulkan:</strong> Kami dapat mengumpulkan informasi non-pribadi seperti jenis browser dan halaman yang dikunjungi.</li>

          <li><strong class="text-slate-800 dark:text-slate-200">Keamanan:</strong> Kami berusaha melindungi data Anda.</li>
          <li><strong class="text-slate-800 dark:text-slate-200">Perubahan:</strong> Kebijakan ini dapat berubah sewaktu-waktu.</li>
        </ul>
        <p>Dengan menggunakan website ini, Anda menyetujui kebijakan privasi yang berlaku.</p>
      `)
    };

    // ============================================================
    // RENDER HOME (dengan search filter)
    // ============================================================
    function renderHome(query = '') {
      const q = query.trim().toLowerCase();
      const filtered = q
        ? articles.filter(a =>
            a.title.toLowerCase().includes(q) ||
            a.description.toLowerCase().includes(q) ||
            a.tags.some(t => t.toLowerCase().includes(q))
          )
        : articles;

      const info = document.getElementById('search-info');
      if (q) {
        info.classList.remove('hidden');
        info.textContent = filtered.length
          ? `Ditemukan ${filtered.length} artikel untuk "${query}"`
          : `Tidak ada artikel untuk "${query}"`;
      } else {
        info.classList.add('hidden');
      }

      if (!filtered.length) {
        return `<div class="text-center py-12 text-slate-500 dark:text-slate-400">
          <p class="text-4xl mb-3">🔍</p>
          <p>Tidak ada artikel yang cocok.</p>
        </div>`;
      }

      return `<section class="space-y-6">${filtered.map(articleCard).join('')}</section>`;
    }

    // ============================================================
    // META & SCHEMA DINAMIS
    // ============================================================
    function updateMeta(page, data = {}) {
      let title, description, url, schema;

      const baseTitle = SITE.name;

      if (data.type === 'article') {
        title = `${data.title} - ${baseTitle}`;
        description = data.description;
        url = `${SITE.url}/#${data.slug}`;
        schema = {
          "@context": "https://schema.org",
          "@type": "BlogPosting",
          "headline": data.title,
          "description": data.description,
          "image": data.image,
          "datePublished": data.date,
          "dateModified": data.date,
          "author": { "@type": "Person", "name": data.author },
          "publisher": {
            "@type": "Organization",
            "name": SITE.name,
            "logo": { "@type": "ImageObject", "url": `${SITE.url}/logo.png` }
          },
          "mainEntityOfPage": { "@type": "WebPage", "@id": url }
        };
      } else {
        const meta = {
          home:       { t: baseTitle,                                 d: SITE.description },
          about:      { t: `About - ${baseTitle}`,                    d: "Tentang Blog Sederhana." },
          contact:    { t: `Contact - ${baseTitle}`,                  d: "Hubungi kami." },
          disclaimer: { t: `Disclaimer - ${baseTitle}`,               d: "Disclaimer Blog Sederhana." },
          privacy:    { t: `Privacy Policy - ${baseTitle}`,           d: "Kebijakan privasi." }
        };
        const m = meta[page] || meta.home;
        title = m.t;
        description = m.d;
        url = `${SITE.url}/#${page}`;
        schema = {
          "@context": "https://schema.org",
          "@type": "WebPage",
          "name": title,
          "description": description,
          "url": url,
          "isPartOf": { "@type": "WebSite", "name": SITE.name, "url": SITE.url }
        };
      }

      // Update DOM
      document.title = title;
      document.querySelector('meta[name="description"]').setAttribute('content', description);
      document.querySelector('meta[property="og:title"]').setAttribute('content', title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', description);
      document.querySelector('meta[property="og:url"]').setAttribute('content', url);
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', description);
      document.getElementById('canonical-link').setAttribute('href', url);
      document.getElementById('schema-jsonld').textContent = JSON.stringify(schema, null, 2);
    }

    // ============================================================
    // BREADCRUMB
    // ============================================================
    function updateBreadcrumb(items) {
      const el = document.getElementById('breadcrumb');
      const parts = items.map((item, i) => {
        const isLast = i === items.length - 1;
        if (isLast) {
          return `<li aria-current="page" class="text-slate-700 dark:text-slate-300 font-medium">${escapeHtml(item.label)}</li>`;
        }
        return `<li>
          <a href="#${item.page}" onclick="navigate('${item.page}')"
            class="hover:text-brand-600 dark:hover:text-brand-400">${escapeHtml(item.label)}</a>
        </li>
        <li class="text-slate-300 dark:text-slate-600">/</li>`;
      }).join('');
      el.innerHTML = parts;

      // Update Breadcrumb schema
      const schema = {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": items.map((item, i) => ({
          "@type": "ListItem",
          "position": i + 1,
          "name": item.label,
          "item": `${SITE.url}/#${item.page}`
        }))
      };
      let bc = document.getElementById('breadcrumb-schema');
      if (!bc) {
        bc = document.createElement('script');
        bc.type = 'application/ld+json';
        bc.id = 'breadcrumb-schema';
        document.head.appendChild(bc);
      }
      bc.textContent = JSON.stringify(schema);
    }

    // ============================================================
    // ROUTING
    // ============================================================
    function navigate(page) {
      const app = document.getElementById('app');
      const searchWrapper = document.getElementById('search-wrapper');

      // Cek apakah halaman = artikel
      const article = articles.find(a => a.slug === page);

      if (article) {
        app.innerHTML = articlePage(article);
        searchWrapper.classList.add('hidden');
        updateMeta(page, { type: 'article', ...article });
        updateBreadcrumb([
          { page: 'home', label: 'Home' },
          { page: 'home', label: 'Artikel' },
          { page: article.slug, label: article.title }
        ]);
      } else if (pages[page]) {
        app.innerHTML = pages[page]();
        searchWrapper.classList.toggle('hidden', page !== 'home');
        updateMeta(page);
        updateBreadcrumb(
          page === 'home'
            ? [{ page: 'home', label: 'Home' }]
            : [{ page: 'home', label: 'Home' }, { page, label: page.charAt(0).toUpperCase() + page.slice(1) }]
        );
      } else {
        app.innerHTML = pages.home();
        searchWrapper.classList.remove('hidden');
        updateMeta('home');
        updateBreadcrumb([{ page: 'home', label: 'Home' }]);
      }

      window.location.hash = page;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleHash() {
      const hash = window.location.hash.replace('#', '') || 'home';
      navigate(hash);
    }

    // ============================================================
    // SEARCH
    // ============================================================
    function handleSearch(value) {
      const app = document.getElementById('app');
      app.innerHTML = renderHome(value);
    }

    // ============================================================
    // DARK MODE
    // ============================================================
    function toggleDark() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('dark-icon').textContent = isDark ? '☀️' : '🌙';
    }

    function initDark() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.getElementById('dark-icon').textContent = '☀️';
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('DOMContentLoaded', () => {
      initDark();
      handleHash();
    });
  </script>

</body>
</html>
